name: Deploy backend to AWS Elastic Beanstalk
##Deploy to AWS Elastic Beanstalk
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Create .env file for backend secrets
        working-directory: vehicle-market-backend
        run: |
          echo "MONGODB_URL=${{ secrets.MONGODB_URL }}" >> .env
          echo "MONGODB_DB_NAME=${{ secrets.MONGODB_DB_NAME }}" >> .env

      - name: Create deployment package
        working-directory: vehicle-market-backend
        run: |
          chmod +x setup.sh
          zip -r deploy.zip . -x "*.git*" -x "venv/*" -x "antenv/*" -x "*/__pycache__/*"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ secrets.EB_APP_NAME }}
          environment_name: ${{ secrets.EB_ENV_NAME }}
          version_label: "autosense-${{ github.sha }}"
          region: ${{ secrets.AWS_REGION }}
          deployment_package: vehicle-market-backend/deploy.zip
