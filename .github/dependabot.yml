version: 2
updates:
  # Maintain dependencies for Main Frontend
  - package-ecosystem: "npm"
    directory: "/vehicle-market-frontend/AutoSenseLK"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5

  # Maintain dependencies for Admin Dashboard
  - package-ecosystem: "npm"
    directory: "/vehicle-market-admindash"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5

  # Maintain dependencies for Python Backend
  - package-ecosystem: "pip"
    directory: "/vehicle-market-backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5

  # Maintain GitHub Actions themselves
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
